# aidev model configuration (v0.5)
#
# This file defines named PROFILES, each containing a set of model
# tiers and a role-to-tier routing. The active profile is what
# aidev resolves on every run.
#
# ---
#
# Switching profiles:
#
#   aidev config show              # print the currently active profile
#   aidev config profile list      # list all available profiles
#   aidev config profile use <name>   # switch active profile
#   aidev config set <role> <provider> <model>   # tweak the active profile
#   aidev config edit              # open this file in $EDITOR
#   aidev config doctor            # validate the active profile
#
# Every config-mutation command prompts for confirmation before
# writing. Pass --yes to bypass the prompt for scripted callers.
#
# ---
#
# Shipped profiles (this PR ships five):
#
#   default    Local Ollama for the agents (Implementer/Reviewer
#              with native tool use, Critic/Architect on Claude
#              CLI for cloud reasoning depth) and Claude CLI as
#              the Coordinator monitoring every agent transition.
#              Recommended for users with both local hardware and
#              a Claude Code subscription.
#
#   cloud-only No local Ollama required. Every agent routes through
#              Claude Code (claude-cli). Best for users without
#              Ollama installed, or CI/sandboxed environments
#              where local model hosting isn't feasible. The
#              recommended profile for the `aidev init` onboarding
#              when Ollama is absent.
#
#   offline    Fully offline. Every role on a local Ollama model.
#              Zero cloud calls. Use when air-gapped, on a plane,
#              or testing without a Claude Code session.
#
#   low-vram   Same routing shape as `default` but every Ollama
#              tier on a 7B model. For laptops without much GPU
#              memory (~5 GB VRAM total).
#
#   high-vram  Same routing shape as `default` but with bigger
#              local models for Implementer/Reviewer (32B coder)
#              and Scout/Tester (14B coder). For workstations
#              with 24+ GB VRAM that can keep multiple models
#              hot.
#
# ---
#
# Tool use (v0.4+):
#
# The Implementer and Reviewer use native tool calls (read_file,
# glob, grep, list_dir) when their tier provider supports it.
# Currently supported: provider: anthropic AND provider: ollama
# with a tool-capable model (qwen2.5, qwen2.5-coder, llama3.1+,
# mistral-nemo, command-r-plus, firefunction-v2). The provider:
# claude-cli backend does NOT support tool use yet — agents on
# claude-cli fall back to the legacy picker + NEED_FILES path.
#
# The four shipped profiles all give the Implementer a tool-using
# tier. If you customize a profile to put the Implementer on
# claude-cli you'll lose tool use; `aidev config doctor` will
# warn you about it.
#
# ---
#
# Timeouts (v0.5b):
#
# Each tier has a 20-minute default wall-clock timeout on a
# single LLM call. That's generous enough for 32b local models
# on M1 Pro-class hardware (~5-10 tok/s × 8k output ≈ 15 min)
# and rarely hit by cloud calls. To override per-tier, add a
# `timeout_seconds` field to the tier:
#
#     tiers:
#       large:
#         provider: ollama
#         model: qwen2.5:32b
#         endpoint: http://localhost:11434
#         max_tokens: 8192
#         temperature: 0.3
#         timeout_seconds: 1800     # 30 min — for slower hardware
#
# Good starting values:
#   small local (7b):    300-600s
#   medium local (14b):  600-900s
#   large local (32b+):  1200-1800s on M1 Pro, less on M3 Max
#   cloud (anthropic):   300s (rarely hit)
#   claude-cli:          600s (subprocess startup overhead)
#
# Zero or omitted means "use the 20-minute default". The
# doctor warns on suspiciously low (<60s) or high (>3600s)
# values.

active_profile: default

profiles:

  default:
    description: |
      Local Ollama for Implementer/Reviewer with native tool use,
      Claude CLI for Critic/Architect/Charter (cloud reasoning
      depth), Claude CLI as the Coordinator monitoring every
      agent transition. The "local horse, cloud jockey" shape.
    tiers:
      small:
        provider: ollama
        model: qwen2.5-coder:7b
        endpoint: http://localhost:11434
        max_tokens: 2048
        temperature: 0.2
      medium:
        provider: ollama
        model: qwen2.5-coder:14b
        endpoint: http://localhost:11434
        max_tokens: 8192
        temperature: 0.2
      cloud_large:
        provider: claude-cli
        model: ""
        max_tokens: 8192
        temperature: 0.3
      oversight:
        provider: claude-cli
        model: ""
        max_tokens: 8192
        temperature: 0.3
    routing:
      scout: small
      tester: small
      implementer: medium
      reviewer: medium
      critic: cloud_large
      architect: cloud_large
      charter: cloud_large
      coordinator: oversight

  cloud-only:
    description: |
      No local Ollama required. Every agent routes through Claude
      Code (claude-cli). Best for users without Ollama installed,
      or CI/sandboxed environments where local model hosting
      isn't feasible. This is the recommended profile for
      `aidev init` onboarding when Ollama isn't present.

      Cost vs. `default`: marginal. The expensive roles
      (critic, architect, coordinator) were already cloud-routed
      in default; cloud-only just redirects the cheap local roles
      (scout, tester, implementer, reviewer) to the same cloud
      tier. Scout and Tester are short prompts; Implementer and
      Reviewer loops can be chattier but still bounded.

      Note: the Implementer loses native tool use (read_file,
      glob, grep, list_dir) when routed through claude-cli, per
      the comment at the top of this file. The legacy picker +
      NEED_FILES path still works; it's just slower on multi-file
      changes than the tool-use path.
    tiers:
      small:
        provider: claude-cli
        model: ""
        max_tokens: 2048
        temperature: 0.2
      medium:
        provider: claude-cli
        model: ""
        max_tokens: 8192
        temperature: 0.2
      cloud_large:
        provider: claude-cli
        model: ""
        max_tokens: 8192
        temperature: 0.3
      oversight:
        provider: claude-cli
        model: ""
        max_tokens: 8192
        temperature: 0.3
    routing:
      scout: small
      tester: small
      implementer: medium
      reviewer: medium
      critic: cloud_large
      architect: cloud_large
      charter: cloud_large
      coordinator: oversight

  offline:
    description: |
      Fully offline. Every role on a local Ollama model. Zero
      cloud calls. Use when air-gapped, on a plane, or testing
      without a Claude Code session. Quality on Critic/Architect
      is meaningfully lower than `default` because local 32B
      models reason less deeply than Claude Opus.
    tiers:
      small:
        provider: ollama
        model: qwen2.5-coder:7b
        endpoint: http://localhost:11434
        max_tokens: 2048
        temperature: 0.2
      medium:
        provider: ollama
        model: qwen2.5-coder:14b
        endpoint: http://localhost:11434
        max_tokens: 8192
        temperature: 0.2
      large:
        provider: ollama
        model: qwen2.5:32b
        endpoint: http://localhost:11434
        max_tokens: 8192
        temperature: 0.3
    routing:
      scout: small
      tester: small
      implementer: medium
      reviewer: medium
      critic: large
      architect: large
      charter: large
      coordinator: large

  low-vram:
    description: |
      Same routing shape as `default` but every Ollama tier on a
      7B model. For laptops with limited GPU memory (~5 GB VRAM
      total). Implementer quality drops compared to `default`
      because the 7B coder model is less capable at multi-file
      changes than the 14B variant. Critic/Architect/Coordinator
      stay on Claude CLI so the judgment quality of the pipeline
      is preserved.
    tiers:
      small:
        provider: ollama
        model: qwen2.5-coder:7b
        endpoint: http://localhost:11434
        max_tokens: 2048
        temperature: 0.2
      cloud_large:
        provider: claude-cli
        model: ""
        max_tokens: 8192
        temperature: 0.3
      oversight:
        provider: claude-cli
        model: ""
        max_tokens: 8192
        temperature: 0.3
    routing:
      scout: small
      tester: small
      implementer: small
      reviewer: small
      critic: cloud_large
      architect: cloud_large
      charter: cloud_large
      coordinator: oversight

  high-vram:
    description: |
      Same routing shape as `default` but with bigger local
      models for Implementer/Reviewer (32B coder) and Scout/Tester
      (14B coder). For workstations with 24+ GB VRAM that can
      keep multiple models hot. Implementer quality approaches
      Claude Sonnet on focused refactors. Critic/Architect stay
      on Claude CLI for the deepest reasoning.
    tiers:
      medium:
        provider: ollama
        model: qwen2.5-coder:14b
        endpoint: http://localhost:11434
        max_tokens: 4096
        temperature: 0.2
      large:
        provider: ollama
        model: qwen2.5-coder:32b
        endpoint: http://localhost:11434
        max_tokens: 16384
        temperature: 0.2
      cloud_large:
        provider: claude-cli
        model: ""
        max_tokens: 8192
        temperature: 0.3
      oversight:
        provider: claude-cli
        model: ""
        max_tokens: 8192
        temperature: 0.3
    routing:
      scout: medium
      tester: medium
      implementer: large
      reviewer: large
      critic: cloud_large
      architect: cloud_large
      charter: cloud_large
      coordinator: oversight
