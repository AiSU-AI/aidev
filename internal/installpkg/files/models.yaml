# Model tier configuration for aidev.
#
# aidev routes each agent role to a model tier. Small tiers run locally
# via Ollama; medium and large tiers default to the Claude Code CLI so
# any user with a Max/Pro subscription gets deep-reasoning agents
# (Critic, Architect, Charter, Reviewer) at no extra per-token cost.
#
# Alternatives you can swap in:
#
#   provider: anthropic   # direct REST API, requires ANTHROPIC_API_KEY
#   provider: ollama      # fully local, no cloud calls
#   provider: claude-cli  # (default) shells out to `claude --print`
#
# Override endpoint/model via environment variables:
#   AIDEV_OLLAMA_URL    override ollama endpoint (default http://localhost:11434)
#   ANTHROPIC_API_KEY   required when any tier uses provider: anthropic
#
# The claude-cli provider uses whichever model your Claude Code
# subscription defaults to when `model` is empty. Set `model` to an
# explicit name (e.g. claude-opus-4-6) to pin it.

tiers:
  small:
    provider: ollama
    model: qwen2.5-coder:7b
    endpoint: http://localhost:11434
    max_tokens: 2048
    temperature: 0.2

  medium:
    provider: claude-cli
    model: ""
    max_tokens: 4096
    temperature: 0.2

  large:
    provider: claude-cli
    model: ""
    max_tokens: 8192
    temperature: 0.3

# Role -> tier routing. Roles that need deep reasoning (critic,
# architect, charter, coordinator) use the large tier. Implementer
# and reviewer use medium. Scout and tester are routed to the small
# local tier for speed and cost.
#
# coordinator is aidev's Gate-1 safety net: it reviews the
# Implementer's diff before it's written to disk and catches common
# failure modes (fabrication, invalid syntax for the file format,
# auxiliary TODO files, partial scope). It runs on the large tier
# because catching those failures is a judgment task — the same
# reason the Critic runs there. If you're running a local
# Implementer (see models.local.yaml), keeping the Coordinator on a
# cloud tier is the recommended "local horse, cloud jockey" shape.
routing:
  scout: small
  critic: large
  architect: large
  charter: large
  coordinator: large
  implementer: medium
  reviewer: medium
  tester: small
